name: "my-grounded-reasoning-agent"
version: "0.1.0"
competition: "office-qa"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/z-ai/glm-5"
  # version: "0.1.2504171455"
  prompt_template_path: "prompts/officeqa_prompt.j2"
  
  # skills & MCP servers removed in v2 — agent uses shell only (grep/sed/python3).
  # skills_dir: "skills/"
  # mcp_dir: "mcp"                   # (disabled) auto-discovers servers from mcp/*/mcp.toml

  # Agent-specific settings (passthrough to constructor):
  # config:
  #   reasoning_effort: "high"

  env:
    OPENROUTER_API_KEY: "${oc.env:OPENROUTER_API_KEY,''}"  # empty default; set before running

environment:
  timeout_per_task: 300
